global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend postgres
    bind *:5432
    default_backend postgres_slaves

backend postgres_slaves
    balance roundrobin
    option tcp-check

    server slave1 pgslave:5432 check
    server slave2 pgasyncslave:5432 check
