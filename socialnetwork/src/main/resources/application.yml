spring:
  application:
    name: socialnetwork

  datasource:
    driver-class-name: org.postgresql.Driver
    master:
      url: ${SPRING_DATASOURCE_MASTER_URL:jdbc:postgresql://pgmaster:5432/postgres}
      username: ${SPRING_DATASOURCE_MASTER_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_MASTER_PASSWORD:pass}
    readhaproxy:
      url: ${SPRING_DATASOURCE_READ_URL:jdbc:postgresql://haproxy:5432/postgres}
      username: ${SPRING_DATASOURCE_READ_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_READ_PASSWORD:pass}

