---
- name: Remove existing Zabbix repository package
  ansible.builtin.apt:
    name: zabbix-release
    state: absent
    purge: true

- name: Download Zabbix repository package
  ansible.builtin.get_url:
    url: "https://repo.zabbix.com/zabbix/7.2/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.2+ubuntu{{ ansible_distribution_version }}_all.deb"
    dest: /tmp/zabbix-release.deb
    mode: '0644'

- name: Install Zabbix repository package
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Zabbix Agent 2
  ansible.builtin.apt:
    name: zabbix-agent2
    state: present

- name: Configure Zabbix Agent 2
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: root
    mode: '0644'

- name: Enable and start Zabbix Agent 2
  ansible.builtin.systemd:
    name: zabbix-agent2
    enabled: true
    state: started