version: "3.8"

services:
  socialnetwork:
    image: ghcr.io/solo157/socialnetwork:latest
    container_name: socialnetwork
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: social-postgres
    restart: always
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"