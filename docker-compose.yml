networks:
  pgnet:
    driver: bridge

services:

  pgmaster:
    image: postgres:16
    container_name: pgmaster
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./volumes/pgmaster:/var/lib/postgresql/data

  pgslave:
    image: postgres:16
    container_name: pgslave
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./volumes/pgslave:/var/lib/postgresql/data

  pgasyncslave:
    image: postgres:16
    container_name: pgasyncslave
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./volumes/pgasyncslave:/var/lib/postgresql/data

  haproxy:
    image: haproxy:latest
    ports:
      - "5433:5432"
      - "8404:8404"
    networks:
      - pgnet
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pgasyncslave
      - pgslave

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    networks:
      - pgnet
    ports:
      - "9092:9092"
    volumes:
      - ./volumes/kafka:/var/lib/kafka/data

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  dialog-service:
    image: ghcr.io/solo157/dialog-service:latest
    container_name: dialog-service
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "9090:9090"
    depends_on:
      redis:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_HOSTS: kafka:9092

  counter-service:
    image: ghcr.io/solo157/counter-service:latest
    container_name: counter-service
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "8092:8092"
    depends_on:
      pgmaster:
        condition: service_started
      redis:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_HOSTS: kafka:9092

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pgnet
    depends_on:
      - socialnetwork1
      - socialnetwork2

  socialnetwork1:
    image: ghcr.io/solo157/socialnetwork:latest
    container_name: socialnetwork1
    restart: unless-stopped
    networks:
      - pgnet
    depends_on:
      pgmaster:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      haproxy:
        condition: service_started
      dialog-service:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  socialnetwork2:
    image: ghcr.io/solo157/socialnetwork:latest
    container_name: socialnetwork2
    restart: unless-stopped
    networks:
      - pgnet
    depends_on:
      pgmaster:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      haproxy:
        condition: service_started
      dialog-service:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
