networks:
  pgnet:
    driver: bridge

services:

  pgmaster:
    image: postgres:16
    container_name: pgmaster
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./volumes/pgmaster:/var/lib/postgresql/data

  pgslave:
    image: postgres:16
    container_name: pgslave
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./volumes/pgslave:/var/lib/postgresql/data

  pgasyncslave:
    image: postgres:16
    container_name: pgasyncslave
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./volumes/pgasyncslave:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "6379:6379"

  app:
    image: ghcr.io/solo157/socialnetwork:latest
    container_name: socialnetwork-app
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "8080:8080"
    depends_on:
      - pgmaster
      - pgslave
      - pgasyncslave
      - redis
    environment:
      SPRING_DATASOURCE_MASTER_URL: jdbc:postgresql://pgmaster:5432/postgres
      SPRING_DATASOURCE_MASTER_USERNAME: postgres
      SPRING_DATASOURCE_MASTER_PASSWORD: pass

      SPRING_DATASOURCE_SLAVE1_URL: jdbc:postgresql://pgslave:5432/postgres
      SPRING_DATASOURCE_SLAVE1_USERNAME: postgres
      SPRING_DATASOURCE_SLAVE1_PASSWORD: pass

      SPRING_DATASOURCE_SLAVE2_URL: jdbc:postgresql://pgasyncslave:5432/postgres
      SPRING_DATASOURCE_SLAVE2_USERNAME: postgres
      SPRING_DATASOURCE_SLAVE2_PASSWORD: pass

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379