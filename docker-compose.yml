networks:
  pgnet:
    driver: bridge

services:

  pgmaster:
    image: postgres:16
    container_name: pgmaster
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./volumes/pgmaster:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  dialog-service:
    image: ghcr.io/solo157/dialog-service:latest
    container_name: dialog-service
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "9090:9090"
    depends_on:
      - redis
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  app:
    image: ghcr.io/solo157/socialnetwork:latest
    container_name: socialnetwork-app
    restart: unless-stopped
    networks:
      - pgnet
    ports:
      - "8080:8080"
    depends_on:
      - pgmaster
      - rabbitmq
      - redis
      - dialog-service
    environment:
      SPRING_DATASOURCE_MASTER_URL: jdbc:postgresql://pgmaster:5432/postgres
      SPRING_DATASOURCE_MASTER_USERNAME: postgres
      SPRING_DATASOURCE_MASTER_PASSWORD: pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
